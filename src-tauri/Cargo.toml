[package]
name = "rin"
version = "0.5.0"
description = "A calm calendar, todo and weather desktop application"
authors = ["Rin"]
edition = "2021"

[lib]
name = "rihe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

